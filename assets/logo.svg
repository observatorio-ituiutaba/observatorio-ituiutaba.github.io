<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.55" stop-color="#2f66d8"/>
      <stop offset="1" stop-color="#26319a"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d5ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6287d9" stop-opacity=".58"/>
